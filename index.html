  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body,#root{height:100%;background:#F4EDE5;font-family:'Nunito',sans-serif}
    body{overflow-x:hidden}
    .app{max-width:430px;margin:0 auto;min-height:100svh;background:#F4EDE5;display:flex;flex-direction:column}
    .hdr{background:linear-gradient(140deg,#2A9D8F,#1F7E72);color:white;padding:16px 20px 14px;padding-top:calc(16px + env(safe-area-inset-top))}
    .hdr-eye{font-size:10px;font-weight:900;opacity:.7;letter-spacing:1.2px;text-transform:uppercase}
    .hdr-name{font-size:23px;font-weight:900;line-height:1.1;margin-top:1px}
    .hdr-date{font-size:13px;font-weight:600;opacity:.8;margin-top:2px}
    .main{flex:1;padding:14px;padding-bottom:calc(82px + env(safe-area-inset-bottom));overflow-y:auto}
    .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:white;border-top:1.5px solid #E2D8CE;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
    .nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 4px 13px;cursor:pointer;color:#AABEBE;background:none;border:none;font-family:inherit;transition:color .15s}
    .nb.on{color:#2A9D8F}
    .nb-i{font-size:22px;line-height:1}
    .nb-l{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
    .card{background:white;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 1px 5px rgba(0,0,0,.05)}
    .ct{font-size:10px;font-weight:900;letter-spacing:.9px;text-transform:uppercase;color:#AABEBE;margin-bottom:11px}
    .seg{display:flex;background:#EDE3D9;border-radius:10px;padding:3px}
    .sb{flex:1;padding:9px;text-align:center;border-radius:7px;font-weight:800;font-size:14px;cursor:pointer;border:none;font-family:inherit;background:none;color:#AABEBE;transition:all .15s}
    .sb.on{background:white;color:#2D3838;box-shadow:0 1px 4px rgba(0,0,0,.1)}
    .notitie{width:100%;padding:10px 12px;background:#F4EDE5;border:none;border-radius:10px;font-family:inherit;font-size:14px;color:#2D3838;outline:none;resize:none;min-height:56px;font-weight:600}
    .notitie:focus{box-shadow:0 0 0 2px #2A9D8F}
    .si{width:100%;padding:11px 13px;background:#F4EDE5;border:none;border-radius:10px;font-family:inherit;font-size:15px;font-weight:600;color:#2D3838;outline:none}

    .reset-btn{width:100%;padding:12px;background:none;color:#E76F51;border:2px solid #E76F51;border-radius:13px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px}

<script type="text/babel">
const {useState,useEffect,useRef} = React;

const today=()=>new Date().toISOString().split('T')[0];
const addDays=(ds,n)=>{const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().split('T')[0];};
const diffDays=(a,b)=>{const da=new Date(a+'T12:00:00'),db=new Date(b+'T12:00:00');return Math.max(0,Math.floor((db-da)/86400000));};
const DS=['Zo','Ma','Di','Wo','Do','Vr','Za'];
const MN=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const DL=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const fmtDate=ds=>{const d=new Date(ds+'T12:00:00');return `${DL[d.getDay()]} ${d.getDate()} ${MN[d.getMonth()]}`;};
const fmtShort=ds=>{const d=new Date(ds+'T12:00:00');return `${d.getDate()} ${MN[d.getMonth()]}`;};

const SMEAR_DAYS=[7,5,4,3,2,1];
const WEEK_LABEL=['Dagelijks (7/7)','Dag 1-5 smeren, dag 6-7 rust','Dag 1-4 smeren, dag 5-7 rust','Dag 1-3 smeren, dag 4-7 rust','Dag 1-2 smeren, dag 3-7 rust','Dag 1 smeren, dag 2-7 rust'];
const WEEK_SHORT=['7/7','5/7','4/7','3/7','2/7','1/7'];
function shouldApply(pd){if(!pd)return false;const d=diffDays(pd.weekStartedAt||today(),today());return Math.min(d,6)<SMEAR_DAYS[Math.min((pd.week||1)-1,5)];}
const pF=w=>!w||w<=2?'#E76F51':w<=4?'#F4A261':'#E9C46A';
const pS=w=>!w||w<=2?'#B84A24':w<=4?'#C87A30':'#B89020';
const SK='#EDE0D4',ST='#C4AD9E';
const INIT=()=>({settings:{kindnaam:'',medicinzalf:'',gebruiker1:'Papa',gebruiker2:'Mama',contactNaDagen:14},log:{},plekken:{},spotCounter:0,setupDone:false,updatedAt:null});

    'Ga naar Authentication (linkermenu) → Sign-in method → Email/wachtwoord → zet aan → Opslaan',

  return (
    <div className="setup">
      <div style={{fontSize:24,fontWeight:900,color:'#2D3838',marginBottom:6}}>⚙️ Eenmalige Firebase setup</div>
      <div style={{fontSize:14,color:'#6B8888',fontWeight:600,lineHeight:1.6,marginBottom:20}}>
        Hierna werkt de app op alle telefoons met real-time sync — geen account nodig voor gebruikers.
      </div>
      {steps.map((s,i)=>(
        <div key={i} style={{display:'flex',gap:12,padding:'12px 14px',background:'white',borderRadius:14,alignItems:'flex-start',marginBottom:9}}>

          <div style={{fontSize:13,fontWeight:600,color:'#2D3838',lineHeight:1.5}}>{s}</div>
        </div>
      ))}
      <div style={{marginTop:8,padding:'12px 14px',background:'#FEF0D7',borderRadius:12,fontSize:12,fontWeight:700,color:'#8E6A0A',lineHeight:1.6}}>
        💡 <strong>Delen:</strong> upload dit HTML-bestand naar GitHub Pages (gratis) en stuur de URL naar je partner. Geen installatie nodig — gewoon openen in Safari/Chrome.

}

// ── Setup View ────────────────────────────────────────────────────────────────
function SetupView({data,upd}){
  const [f,setF]=useState({...data.settings});
  const go=()=>upd(d=>({...d,settings:{...d.settings,...f},setupDone:true}));
  return (
    <div className="setup">
      <div style={{fontSize:26,fontWeight:900,marginBottom:8,color:'#2D3838'}}>💙 Eczeem smeerapp</div>
      <div style={{fontSize:14,color:'#6B8888',marginBottom:22,lineHeight:1.5,fontWeight:600}}>Vul het behandelplan in. Beide verzorgers zien dezelfde data.</div>
      <div className="card">
        <div className="ct">Wie</div>
        {[{k:'kindnaam',l:'Naam van het kind ✱',ph:'Bijv. Noah'},{k:'gebruiker1',l:'Verzorger 1',ph:'Papa'},{k:'gebruiker2',l:'Verzorger 2',ph:'Mama'}].map(x=>(
          <div key={x.k} className="sr"><div className="sl">{x.l}</div><input className="si" value={f[x.k]||''} placeholder={x.ph} onChange={e=>setF(p=>({...p,[x.k]:e.target.value}))}/></div>
        ))}
      </div>
      <div className="card">
        <div className="ct">Medicijn</div>
        <div className="sr"><div className="sl">Medicinzalf</div><input className="si" value={f.medicinzalf||''} placeholder="Bijv. Hydrocortison 1%" onChange={e=>setF(p=>({...p,medicinzalf:e.target.value}))}/></div>
      </div>
      <button className="sg" onClick={go} disabled={!f.kindnaam?.trim()}>Begin →</button>
    </div>
  );
}

// ── Vandaag View ──────────────────────────────────────────────────────────────
function VandaagView({data,upd}){
  const [who,setWho]=useState(data.settings.gebruiker1||'Papa');
  const td=today(),dayLog=data.log[td]||{};
  const spots=Object.entries(data.plekken||{}).filter(([,pd])=>pd.x!==undefined);
  const toSmear=spots.filter(([,pd])=>shouldApply(pd));
  const onRest=spots.filter(([,pd])=>!shouldApply(pd));
  const doneCount=toSmear.filter(([id])=>dayLog.spots?.[id]?.smeared).length;
  const allDone=toSmear.length>0&&doneCount===toSmear.length;
  const users=[data.settings.gebruiker1,data.settings.gebruiker2].filter(Boolean);
  const smearSpot=id=>upd(d=>{
    const lg={...d.log},dy={...(lg[td]||{})},sp={...(dy.spots||{})};
    if(sp[id]?.smeared)delete sp[id];else sp[id]={smeared:true,smearedBy:who};
    return {...d,log:{...lg,[td]:{...dy,spots:sp}}};
  });
  const toggleBasis=t=>upd(d=>{
    const lg={...d.log},dy={...(lg[td]||{})};
    dy[`${t}_basis`]=!dy[`${t}_basis`];
    if(dy[`${t}_basis`])dy[`${t}_door`]=who;else delete dy[`${t}_door`];
    return {...d,log:{...lg,[td]:dy}};
  });
  return (
    <div>
      {spots.length>0&&(
        <div style={{background:allDone?'#DFF3F1':'white',borderRadius:16,padding:'14px 16px',marginBottom:12,boxShadow:'0 1px 5px rgba(0,0,0,.05)',display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:30}}>{allDone?'🎉':toSmear.length===0?'✅':'💊'}</span>
          <div style={{flex:1}}>
            <div style={{fontSize:16,fontWeight:900,color:allDone?'#1D7A6F':'#2D3838'}}>
              {allDone?'Alles gedaan vandaag!':toSmear.length===0?'Geen smeren vandaag':`${doneCount} van ${toSmear.length} gesmeerd`}
            </div>
            <div style={{fontSize:12,fontWeight:600,color:'#AABEBE'}}>{toSmear.length-doneCount>0?`Nog ${toSmear.length-doneCount} te doen`:''}</div>
          </div>
        </div>
      )}
      <div className="card">
        <div className="ct">Wie smeert?</div>
        <div className="seg">{users.map(u=><button key={u} className={`sb ${who===u?'on':''}`} onClick={()=>setWho(u)}>{u}</button>)}</div>
      </div>
      <div className="card">
        <div className="ct">Basiszalf — heel lichaam</div>
        <div style={{display:'flex',gap:8}}>
          {[{t:'o',label:'🌅 Ochtend'},{t:'a',label:'🌙 Avond'}].map(({t,label})=>{
            const done=!!dayLog[`${t}_basis`],door=dayLog[`${t}_door`];
            return (
              <button key={t} onClick={()=>toggleBasis(t)} style={{flex:1,padding:'12px 8px',borderRadius:12,cursor:'pointer',fontFamily:'inherit',border:`2.5px solid ${done?'#2A9D8F':'#E2D8CE'}`,background:done?'#DFF3F1':'white',display:'flex',flexDirection:'column',alignItems:'center',gap:4,transition:'all .18s'}}>
                <span style={{fontSize:20}}>{done?'✅':'○'}</span>
                <span style={{fontSize:13,fontWeight:800,color:done?'#2A9D8F':'#AABEBE'}}>{label}</span>
                <span style={{fontSize:11,fontWeight:600,color:done?'#2A9D8F':'#C4B5AA'}}>{done?(door||'?'):'nog doen'}</span>
              </button>
            );
          })}
        </div>
      </div>
      {spots.length===0?(
        <div className="card" style={{textAlign:'center',color:'#AABEBE',fontWeight:700,padding:'28px 20px'}}>
          <div style={{fontSize:36,marginBottom:8}}>🗺️</div>
          Ga naar <strong>Plekken</strong> om eczeem-plekken te markeren
        </div>
      ):(<>
        {toSmear.length>0&&(
          <div className="card">
            <div className="ct">Medicijn smeren vandaag{data.settings.medicinzalf?` — ${data.settings.medicinzalf}`:''}</div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {toSmear.map(([id,pd])=>{
                const sl=dayLog.spots?.[id],done=!!sl?.smeared,col=pF(pd.week);
                const dInW=diffDays(pd.weekStartedAt||pd.startedAt||td,td);
                return (
                  <div key={id} style={{borderRadius:13,border:`2.5px solid ${done?'#2A9D8F':'#E2D8CE'}`,background:done?'#DFF3F1':'#FAFAF8',padding:'12px',transition:'all .2s'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:9}}>
                      <div style={{width:11,height:11,borderRadius:'50%',background:col,flexShrink:0}}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:15,fontWeight:800,color:'#2D3838',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{pd.label}</div>
                        <div style={{fontSize:11,fontWeight:700,color:'#AABEBE'}}>Week {pd.week}/6 · {WEEK_SHORT[(pd.week||1)-1]} · dag {Math.min(dInW+1,7)}/7 · {pd.side==='back'?'rug':'voor'}</div>
                      </div>
                    </div>
                    {done?(
                      <div style={{display:'flex',alignItems:'center',gap:9}}>
                        <div style={{flex:1,display:'flex',alignItems:'center',gap:8,background:'#C6EDE8',borderRadius:9,padding:'9px 12px'}}>
                          <span style={{fontSize:18}}>✅</span>
                          <div>
                            <div style={{fontSize:13,fontWeight:800,color:'#1D7A6F'}}>Gesmeerd</div>
                            <div style={{fontSize:11,fontWeight:700,color:'#2A9D8F'}}>door {sl.smearedBy}</div>
                          </div>
                        </div>
                        <button onClick={()=>smearSpot(id)} style={{padding:'9px 13px',borderRadius:9,border:'1.5px solid #E2D8CE',background:'white',color:'#AABEBE',fontFamily:'inherit',fontSize:13,fontWeight:700,cursor:'pointer'}}>↩</button>
                      </div>
                    ):(
                      <button onClick={()=>smearSpot(id)} style={{width:'100%',padding:'12px',borderRadius:10,border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:15,fontWeight:800,background:col,color:'white',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
                        <span>💊</span> Markeer als gesmeerd
                      </button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}
        {onRest.length>0&&(
          <div className="card">
            <div className="ct">Rust vandaag</div>

function SchemaView({data,upd}){

    <div>
      {spots.map(([id,pd])=>{

            <BabySVG side={side}/>

              return (<g key={id} style={{pointerEvents:'none'}}>

// ── Sync helpers: voorkom dat een browser met oude lokale state andere wijzigingen overschrijft ──
function isPlainObject(v){
  return v !== null && typeof v === 'object' && !Array.isArray(v);
}
function deepEqual(a,b){
  if(a===b)return true;
  if(!isPlainObject(a)||!isPlainObject(b))return false;
  const ak=Object.keys(a),bk=Object.keys(b);
  if(ak.length!==bk.length)return false;
  return ak.every(k=>Object.prototype.hasOwnProperty.call(b,k)&&deepEqual(a[k],b[k]));
}
function reconcileRemote(remote,oldState,newState){
  // oldState = wat deze browser dacht dat de data was
  // newState = oldState plus de net gemaakte wijziging
  // remote   = nieuwste Firestore-data
  // Resultaat: behoud remote-wijzigingen van andere browsers, maar pas deze lokale wijziging toe.
  if(deepEqual(oldState,newState))return remote;
  if(!isPlainObject(oldState)||!isPlainObject(newState))return newState;

  const out=isPlainObject(remote)?{...remote}:{};
  const keys=new Set([...Object.keys(oldState||{}),...Object.keys(newState||{})]);

  keys.forEach(k=>{
    const oldHas=Object.prototype.hasOwnProperty.call(oldState,k);
    const newHas=Object.prototype.hasOwnProperty.call(newState,k);
    const oldVal=oldState?oldState[k]:undefined;
    const newVal=newState?newState[k]:undefined;
    const remoteVal=isPlainObject(remote)?remote[k]:undefined;

    if(!newHas && oldHas){
      delete out[k];
    } else if(!oldHas && newHas){
      out[k]=newVal;
    } else if(deepEqual(oldVal,newVal)){
      // Deze browser veranderde dit veld niet: behoud nieuwste Firestore-waarde.
      if(isPlainObject(remote) && Object.prototype.hasOwnProperty.call(remote,k)) out[k]=remoteVal;
    } else if(isPlainObject(oldVal)&&isPlainObject(newVal)){
      out[k]=reconcileRemote(remoteVal,oldVal,newVal);
    } else {
      out[k]=newVal;
    }
  });

  return out;
}

const AUTH_EMAIL='familie@eczeem.app';

// ── PinLogin ──────────────────────────────────────────────────────────────────
function PinLogin(){
  const [code,setCode]=useState('');
  const [bezig,setBezig]=useState(false);
  const [fout,setFout]=useState('');

  const login=async()=>{
    if(code.length<6){setFout('Familiecode moet minimaal 6 tekens zijn.');return;}
    setBezig(true);setFout('');
    const auth=firebase.auth();
    try{
      await auth.signInWithEmailAndPassword(AUTH_EMAIL,code);
    }catch(e){
      if(e.code==='auth/user-not-found'||e.code==='auth/invalid-credential'||e.code==='auth/invalid-login-credentials'||e.code==='auth/invalid-email'){
        try{
          await auth.createUserWithEmailAndPassword(AUTH_EMAIL,code);
        }catch(e2){
          if(e2.code==='auth/email-already-in-use'){
            setFout('Verkeerde familiecode. Vraag je partner welke code zij hebben gekozen.');
          }else if(e2.code==='auth/weak-password'){
            setFout('Familiecode te kort — minimaal 6 tekens.');
          }else if(e2.code==='auth/configuration-not-found'||e2.code==='auth/operation-not-allowed'){
            setFout('E-mail/wachtwoord login is niet ingeschakeld in Firebase. Ga naar Authentication → Sign-in method → Email/wachtwoord → Zet aan.');
          }else{
            setFout('Fout: '+e2.message);
          }
        }
      }else if(e.code==='auth/wrong-password'){
        setFout('Verkeerde familiecode. Vraag je partner welke code zij hebben gekozen.');
      }else if(e.code==='auth/configuration-not-found'||e.code==='auth/operation-not-allowed'){
        setFout('E-mail/wachtwoord login is niet ingeschakeld in Firebase. Ga naar Authentication → Sign-in method → Email/wachtwoord → Zet aan.');
      }else{
        setFout('Fout: '+e.message);
      }
    }
    setBezig(false);
  };

  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100svh',background:'#F4EDE5',padding:28,fontFamily:'Nunito,sans-serif'}}>
      <div style={{fontSize:40,marginBottom:8}}>💙</div>
      <div style={{fontSize:22,fontWeight:900,color:'#2D3838',marginBottom:6}}>Eczeem Smeerapp</div>
      <div style={{fontSize:13,fontWeight:600,color:'#6B8888',marginBottom:28,textAlign:'center',lineHeight:1.5}}>
        Voer de familiecode in.<br/>Beide ouders gebruiken dezelfde code.
      </div>
      <input
        type="password"
        placeholder="Familiecode (min. 6 tekens)"
        value={code}
        onChange={e=>setCode(e.target.value)}
        onKeyDown={e=>e.key==='Enter'&&login()}
        style={{width:'100%',maxWidth:320,padding:'14px 16px',borderRadius:14,border:'2px solid #D4C8BE',fontSize:16,fontFamily:'Nunito,sans-serif',fontWeight:700,outline:'none',marginBottom:12,background:'white'}}
      />
      {fout&&<div style={{color:'#c0392b',fontSize:12,fontWeight:700,marginBottom:10,maxWidth:320,textAlign:'center',lineHeight:1.5}}>{fout}</div>}
      <button
        onClick={login}
        disabled={bezig}
        style={{width:'100%',maxWidth:320,padding:'14px',borderRadius:14,border:'none',background:'#2A9D8F',color:'white',fontSize:16,fontWeight:900,fontFamily:'Nunito,sans-serif',cursor:bezig?'not-allowed':'pointer',opacity:bezig?.7:1}}
      >{bezig?'Bezig…':'Inloggen / aanmaken'}</button>
      <div style={{marginTop:20,fontSize:11,color:'#AABEBE',fontWeight:600,textAlign:'center',maxWidth:300,lineHeight:1.6}}>
        Eerste keer? Kies zelf een code en deel hem met je partner. De code wordt opgeslagen in Firebase.
      </div>
    </div>
  );
}

  const [synced,setSynced]=useState(false);

  useEffect(()=>{
    if(!IS_CONFIGURED)return;
    return firebase.auth().onAuthStateChanged(u=>setUser(u||null));
  },[]);

  useEffect(()=>{
    if(!user||!DOC)return;
    setSynced(false);
    const unsub=DOC.onSnapshot(snap=>{
      setSynced(true);
      if(snap.exists){
        const d=snap.data();
        lsSave(d);
        setData(d);
      } else {
        // Nooit automatisch lokale data naar Firebase pushen vanaf een nieuw device.
        // Schrijven gebeurt pas na setup of een bewuste wijziging door de gebruiker.
        setData(INIT());
      }
    },err=>{
      console.error('Firestore lezen mislukt:',err);
      alert('Firebase lezen mislukt: '+err.message);
      // Alleen als noodfallback tonen we lokale cache; niet automatisch terugschrijven.
      setData(lsLoad()||INIT());
    });
    return unsub;
  },[user]);

  const upd=fn=>setData(prev=>{
    if(!prev)return prev;

    // Bereken de lokale wijziging één keer. Sommige updates maken een nieuw id met Date.now();
    // daarom mag fn niet opnieuw worden uitgevoerd binnen de Firebase-transaction.
    const localNext={...fn(prev),updatedAt:new Date().toISOString()};
    lsSave(localNext);

    if(DOC&&user){
      DOC.firestore.runTransaction(async tx=>{
        const snap=await tx.get(DOC);
        const remote=snap.exists?snap.data():INIT();
        const merged={...reconcileRemote(remote,prev,localNext),updatedAt:new Date().toISOString()};
        tx.set(DOC,merged);
        return merged;
      }).then(merged=>{
        lsSave(merged);
        setData(merged);
      }).catch(e=>{
        console.error('Firebase opslaan mislukt:',e);
        alert('Firebase opslaan mislukt: '+e.message);
      });
    } else {
      alert('Niet opgeslagen naar Firebase: geen actieve login.');
    }

    // Optimistisch tonen; de onSnapshot of transaction-resultaat zet daarna de definitieve Firebase-state.
    return localNext;
  });

  if(!IS_CONFIGURED) return <div className="app"><FirebaseSetup/></div>;
  if(user===undefined) return <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100svh',background:'#F4EDE5',fontFamily:'Nunito,sans-serif',color:'#AABEBE',fontWeight:700,gap:10}}><span style={{fontSize:40}}>💙</span><span>Laden…</span></div>;
  if(!user) return <PinLogin/>;
  if(!data) return <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100svh',background:'#F4EDE5',fontFamily:'Nunito,sans-serif',color:'#AABEBE',fontWeight:700,gap:10}}><span style={{fontSize:40}}>💙</span><span>Gegevens laden…</span></div>;
  if(!data.setupDone) return <div className="app"><SetupView data={data} upd={upd}/></div>;
  return (
    <div className="app">
      <header className="hdr">
        <div className="hdr-eye">Eczeem smeerapp</div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div className="hdr-name">💙 {data.settings.kindnaam}</div>
          <div title={synced?'Gesynchroniseerd':'Verbinden…'} style={{width:10,height:10,borderRadius:'50%',background:synced?'#22C55E':'#F59E0B',flexShrink:0,marginLeft:8}}/>
        </div>
        <div className="hdr-date">{fmtDate(today())}</div>
      </header>
      <main className="main">
        {tab==='vandaag'&&<VandaagView data={data} upd={upd}/>}
        {tab==='schema' &&<SchemaView  data={data} upd={upd}/>}
        {tab==='kaart'  &&<KaartView   data={data} upd={upd}/>}
        {tab==='info'   &&<InfoView    data={data} upd={upd}/>}
      </main>
      <nav className="nav">
        {[{id:'vandaag',i:'☀️',l:'Vandaag'},{id:'schema',i:'📅',l:'Schema'},{id:'kaart',i:'🗺️',l:'Plekken'},{id:'info',i:'⚙️',l:'Instellingen'}].map(n=>(
          <button key={n.id} className={`nb ${tab===n.id?'on':''}`} onClick={()=>setTab(n.id)}>
            <span className="nb-i">{n.i}</span><span className="nb-l">{n.l}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
